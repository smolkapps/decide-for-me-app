name: Studio unsigned native iOS check

# Keep the existing unit-test gate, then compile without signing or publication.
# The original TestFlight workflow stays disabled and unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-unsigned-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-check:
    name: Existing unit tests and unsigned iOS Release build
    # Studio by default; STUDIO_CI_MACOS_26 restores the original hosted runner.
    runs-on: ${{ fromJSON(format(vars.STUDIO_CI_MACOS_26 || '["self-hosted","macOS","ARM64","studio-macos","studio-run-{0}"]', github.run_id)) }}
    timeout-minutes: 45

    env:
      SCHEME: DecideForMe
      PROJECT: DecideForMe.xcodeproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 (fall back to latest available)
        run: |
          if [[ "$RUNNER_NAME" == studio-* ]]; then
            export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
            echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
            xcodebuild -version
            exit 0
          fi
          if [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            echo "Xcode 26.x not found; using the default toolchain:"
          fi
          xcodebuild -version

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned Release for iOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""
