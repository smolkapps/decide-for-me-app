name: TestFlight

# TESTFLIGHT ONLY. This workflow archives the app and uploads the build to
# TestFlight via `altool`. It NEVER submits to App Store review — that is a
# manual step in App Store Connect.

on:
  workflow_dispatch:
  push:
    tags:
      - "testflight-*"

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45

    env:
      SCHEME: DecideForMe
      PROJECT: DecideForMe.xcodeproj
      BUNDLE_ID: org.smolkin.DecideForMe
      TEAM_ID: 4R42A425CK
      PROFILE_NAME: DecideForMe AppStore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 (fall back to latest available)
        run: |
          if [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            echo "Xcode 26.x not found; using the default toolchain:"
          fi
          xcodebuild -version

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || xcodebuild test \
                -project "$PROJECT" \
                -scheme "$SCHEME" \
                -destination 'platform=iOS Simulator,name=iPhone 17' \
                CODE_SIGNING_ALLOWED=NO

      - name: Install certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT=$RUNNER_TEMP/cert.p12
          PP=$RUNNER_TEMP/profile.mobileprovision
          KC=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KC
          security set-keychain-settings -lut 21600 $KC
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KC

          # Import WITHOUT -t cert so the private key comes in too (otherwise
          # there are 0 valid signing identities).
          security import $CERT -P "$P12_PASSWORD" -A -f pkcs12 -k $KC \
            -T /usr/bin/codesign -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KC
          security list-keychain -d user -s $KC $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KC

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP ~/Library/MobileDevice/Provisioning\ Profiles/

          echo "Signing identities available:"
          security find-identity -v -p codesigning $KC

      - name: Configure manual signing
        run: |
          python3 - <<'PYEOF'
          path = "DecideForMe.xcodeproj/project.pbxproj"
          with open(path) as f:
              content = f.read()
          # Build the identity string dynamically to dodge GHA secret masking
          # if P12_PASSWORD ever equals the identity name.
          DIST = "Apple" + " " + "Distribution"
          PROFILE = "DecideForMe AppStore"

          content = content.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")

          # Inject CODE_SIGN_IDENTITY + PROVISIONING_PROFILE_SPECIFIER for the
          # app target's build configs. The app configs carry an APPICON entry,
          # which the test-target configs do not — so anchoring on that keeps
          # this patch off the test target.
          marker = "ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;"
          inject = (
              marker
              + f'\n\t\t\t\tCODE_SIGN_IDENTITY = "{DIST}";'
              + f'\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{PROFILE}";'
          )
          content = content.replace(marker, inject)

          with open(path, "w") as f:
              f.write(content)
          print("Patched project for manual signing.")
          PYEOF
          plutil -lint DecideForMe.xcodeproj/project.pbxproj

      - name: Stamp build number
        run: |
          BUILD_NUMBER=$(date +%Y%m%d%H%M%S)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" \
            "$RUNNER_TEMP/none" 2>/dev/null || true
          xcrun agvtool new-version -all "$BUILD_NUMBER" || \
            sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" \
              DecideForMe.xcodeproj/project.pbxproj
          echo "Build number set to $BUILD_NUMBER"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/DecideForMe.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            | xcpretty || xcodebuild archive \
                -project "$PROJECT" \
                -scheme "$SCHEME" \
                -configuration Release \
                -archivePath "$RUNNER_TEMP/DecideForMe.xcarchive" \
                -destination 'generic/platform=iOS' \
                CODE_SIGN_STYLE=Manual \
                DEVELOPMENT_TEAM="$TEAM_ID" \
                PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DecideForMe.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            | xcpretty || xcodebuild -exportArchive \
                -archivePath "$RUNNER_TEMP/DecideForMe.xcarchive" \
                -exportOptionsPlist ExportOptions.plist \
                -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          # altool's --upload-app pushes the build to App Store Connect /
          # TestFlight processing. It does NOT submit to App Store review.
          mkdir -p ~/.appstoreconnect/private_keys/
          echo "$API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
          echo "Build uploaded to TestFlight processing."
